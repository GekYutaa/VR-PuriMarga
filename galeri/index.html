        <a class="nav-logo" href="../index.html"
          ><img
            alt="Logo"
            decoding="async"
            height="148"
            src="../assets/img/ui/logo-puri.webp"
            width="148"

        </button>
      </div>

      <section class="page-hero">
        <div class="container reveal">
          <p class="eyebrow dark">DOKUMENTASI VISUAL</p>

          <p>
            Dokumentasi visual bangunan dan lingkungan Puri Ageng Marga yang tersedia dari bahan

          </p>

            data-category="bangunan"
            role="button"
            tabindex="0"
          >

              alt="Bale Agung"
              decoding="async"
              height="496"
              loading="lazy"
              src="../assets/img/bangunan/bale-agung.webp"
